name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    # Автодеплой включается переменной репозитория DEPLOY_ENABLED=true после настройки сервера
    # и секретов (deploy/README.md); без неё CI только проверяет код — например, в форках.
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        # ghcr требует имя образа в нижнем регистре.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # deploy.sh на сервере сверяет эту метку с SHA, который просят выкатить.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull image
        # Образ едет на сервер по ssh (docker save | ssh), поэтому серверу не нужен токен ghcr.
        run: docker pull "$IMAGE:${{ github.sha }}"

      - name: Deploy
        # Явный bash включает pipefail: сбой docker save не потеряется в конвейере.
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          for name in SSH_KEY KNOWN_HOSTS SSH_HOST SSH_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задан секрет для $name (см. deploy/README.md)"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Отпечаток не секретный: по нему видно, тот ли ключ лежит в DEPLOY_SSH_KEY.
          ssh-keygen -lf ~/.ssh/deploy_key || { echo "::error::DEPLOY_SSH_KEY не похож на приватный ssh-ключ (вставлен не целиком?)"; exit 1; }
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Ключ на сервере привязан к forced command (deploy/deploy.sh): единственное,
          # что им можно сделать, — передать образ и выкатить его по этому SHA.
          docker image save "$IMAGE:${{ github.sha }}" | ssh -C -T \
            -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "${{ github.sha }}"
