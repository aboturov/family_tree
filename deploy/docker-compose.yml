# Лежит на сервере в /opt/family-tree; при изменении скопировать вручную (см. deploy/README.md).
# TREE_IMAGE задаётся в .env при настройке, TREE_TAG переписывает deploy.sh.
services:
  app:
    image: ${TREE_IMAGE:?}:${TREE_TAG:?}
    # Образ приезжает через deploy.sh (docker load), в ghcr сервер не ходит.
    pull_policy: never
    restart: unless-stopped
    # Портов на хост нет: наружу приложение отдаёт обратный прокси (Caddy) через свою сеть.
    volumes:
      # База, бэкапы и (позже) медиа. Каталог должен принадлежать uid 1000 (пользователь node в образе).
      - ./data:/data
    networks:
      ingress-tree:
        aliases: [family-tree]

networks:
  # Создаёт compose прокси, приложение подключается как к внешней. В этой сети нет никого,
  # кроме прокси: приложение верит его X-Real-IP (лимиты входа).
  ingress-tree:
    external: true
