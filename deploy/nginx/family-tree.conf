# /etc/nginx/sites-available/family-tree — tree.example.com заменить на свой домен.
# Блок с 443 и сертификатом допишет certbot --nginx.

# Вход: не чаще 10 попыток в минуту с одного адреса (сверх этого — сразу 429).
# Второй рубеж после лимитов в приложении, отсекает поток запросов ещё до scrypt.
limit_req_zone $binary_remote_addr zone=tree_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tree.example.com;

    # Задел под загрузку фото.
    client_max_body_size 25m;

    # Только если сайт за Cloudflare (см. deploy/README.md).
    include snippets/cloudflare-realip.conf;

    location = /api/auth/login {
        limit_req zone=tree_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
